<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Registration - Human-Centered AI Smart Farming</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-card" style="max-width: 540px;">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="fa-solid fa-user-plus" style="color: #1b4332;"></i>
            </div>
            <h1 class="auth-title">Farmer Registration</h1>
            <p class="auth-sub">Create your smart farming profile</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category if category != 'error' else 'danger' }}">
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('register') }}" method="POST">
            <div class="grid-2">
                <div class="form-group">
                    <label for="name" class="form-label">Full Name *</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="Ramesh Kumar" required>
                </div>
                <div class="form-group">
                    <label for="email" class="form-label">Email Address *</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="ramesh@farm.com" required>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="password" class="form-label">Password *</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="tel" id="phone" name="phone" class="form-control" placeholder="+91 9876543210">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="location" class="form-label">Location / District</label>
                    <input type="text" id="location" name="location" class="form-control" placeholder="Coimbatore, Tamil Nadu">
                </div>
                <div class="form-group">
                    <label for="farm_size" class="form-label">Farm Size (Acres)</label>
                    <input type="number" step="0.1" id="farm_size" name="farm_size" class="form-control" placeholder="5.5">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="soil_type" class="form-label">Primary Soil Type</label>
                    <select id="soil_type" name="soil_type" class="form-control">
                        <option value="Loamy">Loamy Soil</option>
                        <option value="Clay">Clay Soil</option>
                        <option value="Black">Black Cotton Soil</option>
                        <option value="Red">Red Soil</option>
                        <option value="Sandy">Sandy Soil</option>
                        <option value="Alluvial">Alluvial Soil</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="preferred_language" class="form-label">Preferred Language</label>
                    <select id="preferred_language" name="preferred_language" class="form-control">
                        <option value="en">English</option>
                        <option value="ta">தமிழ் (Tamil)</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                <i class="fa-solid fa-check"></i> Complete Registration
            </button>
        </form>

        <div class="auth-footer">
            Already registered? <a href="{{ url_for('login') }}">Sign In here</a>
        </div>
    </div>
</body>
</html>
